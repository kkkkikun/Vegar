# Cargo configuration for VegarOS
# This config supports both offline (vendor) and online builds

[source.crates-io]
replace-with = 'vendored-sources'

# Vendor source: try to use vendored dependencies first
[source.vendored-sources]
directory = '../vendor'

# Fallback to network if vendor directory is missing
# This allows building without vendor (e.g., during development)
# The evaluation system will use vendor when available
