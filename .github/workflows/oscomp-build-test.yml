name: OSComp Build Test

on:
  push:
    branches:
      - main
      - latest-oscamp
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oscomp-build:
    name: Build OSComp Submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: riscv64gc-unknown-none-elf

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            gcc-loongarch64-linux-gnu \
            make \
            curl \
            xz-utils

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rust targets
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup target add loongarch64-unknown-none-softfloat

      - name: Build OSComp submission (make all)
        run: |
          echo "=== Building OSComp 2026 Submission ==="
          make all

      - name: Verify kernel files exist
        run: |
          echo "=== Verifying build outputs ==="
          if [ ! -f kernel-rv ]; then
            echo "ERROR: kernel-rv not found"
            exit 1
          fi
          if [ ! -f kernel-la ]; then
            echo "ERROR: kernel-la not found"
            exit 1
          fi
          echo "✓ kernel-rv: $(wc -c < kernel-rv) bytes"
          echo "✓ kernel-la: $(wc -c < kernel-la) bytes"

      - name: Upload kernels
        uses: actions/upload-artifact@v4
        with:
          name: oscomp-kernels
          path: |
            kernel-rv
            kernel-la
          retention-days: 7

  oscomp-checksum-test:
    name: Test Checksum Validation
    runs-on: ubuntu-latest
    needs: oscomp-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test fresh clone build
        run: |
          echo "=== Testing fresh clone scenario ==="
          cd /tmp
          rm -rf test-clone
          git clone --depth=1 ${{ github.repositoryUrl }} test-clone
          cd test-clone

          echo "Building in clean environment..."
          make all

          if [ ! -f kernel-rv ] || [ ! -f kernel-la ]; then
            echo "ERROR: Build failed in clean environment"
            exit 1
          fi

          echo "✓ Fresh clone build successful"
