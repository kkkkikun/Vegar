name: OSComp 评测模拟

on:
  push:
    branches:
      - main
      - latest-oscamp
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试磁盘镜像下载地址（OSComp 官方测试套件）
  RV_TEST_DISK_URL: https://github.com/oscomp/testsuits-for-oskernel/releases/download/on-site-final-2025-rv64-fs/alpine-linux-riscv64-ext4fs.img.xz
  LA_TEST_DISK_URL: https://github.com/oscomp/testsuits-for-oskernel/releases/download/on-site-final-2025-la64-fs/alpine-linux-loongarch64-ext4fs.img.xz

jobs:
  # ===========================================================================
  # Job 1: 官方 Docker 环境构建测试
  # ===========================================================================
  docker-build-test:
    name: 官方环境构建
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 执行 make all（评测命令）
        run: |
          echo "=== 执行官方评测命令：make all ==="
          make all

      - name: 验证必需文件存在
        run: |
          echo "=== 验证评测必需文件 ==="
          if [ ! -f kernel-rv ]; then
            echo "❌ 错误：kernel-rv 文件不存在"
            exit 1
          fi
          echo "✓ kernel-rv 存在 ($(wc -c < kernel-rv) 字节)"
          if [ ! -f kernel-la ]; then
            echo "❌ 错误：kernel-la 文件不存在"
            exit 1
          fi
          echo "✓ kernel-la 存在 ($(wc -c < kernel-la) 字节)"
          file kernel-rv | grep -q ELF && echo "✓ kernel-rv 是 ELF 格式" || echo "ℹ️  kernel-rv 是 raw binary 格式（QEMU 兼容）"
          file kernel-la | grep -q ELF && echo "✓ kernel-la 是 ELF 格式" || echo "ℹ️  kernel-la 是 raw binary 格式（QEMU 兼容）"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: oscomp-kernels
          path: |
            kernel-rv
            kernel-la
            disk-rv.img
            disk-la.img
          retention-days: 7

  # ===========================================================================
  # Job 2: 模拟评测环境（隐藏文件过滤后再构建）
  # ===========================================================================
  eval-simulation-test:
    name: 隐藏文件过滤测试
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 模拟评测系统过滤隐藏文件
        run: |
          echo "=== 删除隐藏目录（模拟评测系统） ==="
          # 只删除顶层的隐藏文件/目录，保留 vendor 内部的结构
          find . -maxdepth 1 -name ".*" -type d -not -name ".git" -not -name ".github" -exec rm -rf {} + 2>/dev/null || true
          find . -maxdepth 1 -name ".*" -type f -delete 2>/dev/null || true
          echo "隐藏文件清理完成"

      - name: 执行 make all
        run: |
          echo "=== 模拟评测环境中执行 make all ==="
          make all

      - name: 验证构建结果
        run: |
          if [ ! -f kernel-rv ]; then
            echo "❌ kernel-rv 构建失败"
            exit 1
          fi
          if [ ! -f kernel-la ]; then
            echo "❌ kernel-la 构建失败"
            exit 1
          fi
          echo "✓ 评测模拟环境构建成功"
          echo "  kernel-rv: $(wc -c < kernel-rv) 字节"
          echo "  kernel-la: $(wc -c < kernel-la) 字节"

  # ===========================================================================
  # Job 3: RISC-V QEMU 启动测试（使用官方测试磁盘）
  # ===========================================================================
  rv-qemu-test:
    name: RISC-V QEMU 启动
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root
    needs: docker-build-test

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 构建内核
        run: make all

      - name: 下载 RISC-V 评测磁盘镜像
        run: |
          echo "下载 RISC-V 测试磁盘镜像..."
          wget -q -L -O test-disk-rv.img.xz "$RV_TEST_DISK_URL"
          xz -d test-disk-rv.img.xz
          echo "✓ 测试磁盘镜像准备完成 ($(wc -c < test-disk-rv.img) 字节)"

      - name: QEMU 启动测试
        run: |
          echo "=== RISC-V QEMU 启动测试（双磁盘模拟评测） ==="
          echo "启动内核并等待 60 秒..."
          timeout 60 \
            qemu-system-riscv64 \
            -machine virt \
            -kernel kernel-rv \
            -m 1G \
            -nographic \
            -smp 1 \
            -bios default \
            -drive file=test-disk-rv.img,if=none,format=raw,id=x0 \
            -device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0 \
            -no-reboot \
            -device virtio-net-device,netdev=net \
            -netdev user,id=net \
            -rtc base=utc \
            -drive file=disk-rv.img,if=none,format=raw,id=x1 \
            -device virtio-blk-device,drive=x1,bus=virtio-mmio-bus.1 \
            2>&1 | tee qemu-rv.log || true

          echo ""
          echo "=== QEMU 输出分析 ==="
          log_size=$(wc -c < qemu-rv.log 2>/dev/null || echo 0)
          echo "QEMU 输出大小: $log_size 字节"

          # 检查是否回归了双磁盘挂载崩溃
          if grep -q "OperationNotSupported" qemu-rv.log 2>/dev/null; then
            echo "❌ 双磁盘挂载失败（OperationNotSupported），块设备选择 BUG 回归！"
            grep "OperationNotSupported" qemu-rv.log
            exit 1
          fi

          # 检查测试是否真正运行
          if grep -q "OS COMP TEST GROUP\|setup done" qemu-rv.log 2>/dev/null; then
            echo "✅ 测试正常运行"
            grep -c "OS COMP TEST GROUP" qemu-rv.log 2>/dev/null || true
          elif grep -q "Failed to resolve executable" qemu-rv.log 2>/dev/null; then
            echo "ℹ️  文件系统挂载成功，但 CI 测试磁盘缺少 /musl/busybox（非代码问题）"
            echo "   官方评测磁盘包含正确的 busybox 路径，CI 使用 Alpine 磁盘仅验证启动"
          else
            echo "❌ 内核异常退出"
            echo "--- 最后 20 行 QEMU 输出 ---"
            tail -20 qemu-rv.log
            exit 1
          fi

          echo "✅ RISC-V 启动测试通过"

      - name: 上传 QEMU 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rv-log
          path: qemu-rv.log
          retention-days: 7

  # ===========================================================================
  # Job 4: LoongArch QEMU 启动测试（使用官方测试磁盘）
  # ===========================================================================
  la-qemu-test:
    name: LoongArch QEMU 启动
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root
    needs: docker-build-test

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 构建内核
        run: make all

      - name: 下载 LoongArch 评测磁盘镜像
        run: |
          echo "下载 LoongArch 测试磁盘镜像..."
          wget -q -L -O test-disk-la.img.xz "$LA_TEST_DISK_URL"
          xz -d test-disk-la.img.xz
          echo "✓ 测试磁盘镜像准备完成 ($(wc -c < test-disk-la.img) 字节)"

      - name: QEMU 启动测试
        run: |
          echo "=== LoongArch QEMU 启动测试（双磁盘模拟评测） ==="
          echo "启动内核并等待 60 秒..."
          timeout 60 \
            qemu-system-loongarch64 \
            -machine virt \
            -kernel kernel-la \
            -m 1G \
            -nographic \
            -smp 1 \
            -drive file=test-disk-la.img,if=none,format=raw,id=x0 \
            -device virtio-blk-pci,drive=x0 \
            -no-reboot \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp::5555-:5555,hostfwd=udp::5555-:5555 \
            -rtc base=utc \
            -drive file=disk-la.img,if=none,format=raw,id=x1 \
            -device virtio-blk-pci,drive=x1 \
            2>&1 | tee qemu-la.log || true

          echo ""
          echo "=== QEMU 输出分析 ==="
          log_size=$(wc -c < qemu-la.log 2>/dev/null || echo 0)
          echo "QEMU 输出大小: $log_size 字节"

          if grep -q "OperationNotSupported" qemu-la.log 2>/dev/null; then
            echo "❌ 双磁盘挂载失败（OperationNotSupported），块设备选择 BUG 回归！"
            grep "OperationNotSupported" qemu-la.log
            exit 1
          fi

          if grep -q "OS COMP TEST GROUP\|setup done" qemu-la.log 2>/dev/null; then
            echo "✅ 测试正常运行"
            grep -c "OS COMP TEST GROUP" qemu-la.log 2>/dev/null || true
          elif grep -q "Failed to resolve executable" qemu-la.log 2>/dev/null; then
            echo "ℹ️  文件系统挂载成功，但 CI 测试磁盘缺少 /musl/busybox（非代码问题）"
            echo "   官方评测磁盘包含正确的 busybox 路径，CI 使用 Alpine 磁盘仅验证启动"
          else
            echo "❌ 内核异常退出"
            echo "--- 最后 20 行 QEMU 输出 ---"
            tail -20 qemu-la.log
            exit 1
          fi

          echo "✅ LoongArch 启动测试通过"

      - name: 上传 QEMU 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-la-log
          path: qemu-la.log
          retention-days: 7
