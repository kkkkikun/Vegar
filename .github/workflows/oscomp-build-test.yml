name: OSComp 评测模拟

on:
  push:
    branches:
      - main
      - latest-oscamp
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 使用官方评测 Docker 环境进行完整测试
  docker-build-test:
    name: 官方评测环境测试
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 执行 make all（评测命令）
        run: |
          echo "=== 执行官方评测命令：make all ==="
          make all

      - name: 验证必需文件存在
        run: |
          echo "=== 验证评测必需文件 ==="
          if [ ! -f kernel-rv ]; then
            echo "❌ 错误：kernel-rv 文件不存在"
            exit 1
          fi
          echo "✓ kernel-rv 存在 ($(wc -c < kernel-rv) 字节)"
          if [ ! -f kernel-la ]; then
            echo "❌ 错误：kernel-la 文件不存在"
            exit 1
          fi
          echo "✓ kernel-la 存在 ($(wc -c < kernel-la) 字节)"
          file kernel-rv | grep -q ELF || echo "⚠️  警告：kernel-rv 不是 ELF 格式"
          file kernel-la | grep -q ELF || echo "⚠️  警告：kernel-la 不是 ELF 格式"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: oscomp-kernels
          path: |
            kernel-rv
            kernel-la
            disk.img
          retention-days: 7

  # 模拟评测环境：删除隐藏文件后再构建
  eval-simulation-test:
    name: 评测环境模拟测试
    runs-on: ubuntu-latest
    container:
      image: zhouzhouyi/os-contest:20260510
      options: --user root

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 模拟评测系统过滤隐藏文件
        run: |
          echo "=== 删除隐藏目录（模拟评测系统） ==="
          # 只删除顶层的隐藏目录，保留 vendor 内部的文件
          find . -maxdepth 1 -name ".*" -type d -not -name ".git" -not -name ".github" -exec rm -rf {} + 2>/dev/null || true
          # 删除顶层隐藏文件
          find . -maxdepth 1 -name ".*" -type f -delete 2>/dev/null || true
          echo "隐藏文件清理完成"

      - name: 执行 make all
        run: |
          echo "=== 模拟评测环境中执行 make all ==="
          make all

      - name: 验证构建结果
        run: |
          if [ ! -f kernel-rv ]; then
            echo "❌ kernel-rv 构建失败"
            exit 1
          fi
          if [ ! -f kernel-la ]; then
            echo "❌ kernel-la 构建失败"
            exit 1
          fi
          echo "✓ 评测模拟环境构建成功"
          echo "  kernel-rv: $(wc -c < kernel-rv) 字节"
          echo "  kernel-la: $(wc -c < kernel-la) 字节"
