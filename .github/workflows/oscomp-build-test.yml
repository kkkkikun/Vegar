name: OSComp 评测模拟

on:
  push:
    branches:
      - main
      - latest-oscamp
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 使用比赛 Docker 环境进行完整测试
  docker-build-test:
    name: Docker 环境构建测试
    runs-on: ubuntu-latest
    container:
      image: docker.cnb.cool/starry-os/arceos-build:latest
      options: --user root

    steps:
      - name: 克隆代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 清理隐藏目录（模拟评测系统过滤）
        run: |
          echo "=== 模拟评测系统过滤隐藏文件 ==="
          find . -name ".*" -type d -not -path "./.git/*" -not -path "./.github/*" -exec rm -rf {} + 2>/dev/null || true
          find . -name ".*" -type f -not -path "./.git/*" -not -path "./.github/*" -delete 2>/dev/null || true

      - name: 执行 make all（评测命令）
        run: |
          echo "=== 执行官方评测命令：make all ==="
          make all

      - name: 验证必需文件存在
        run: |
          echo "=== 验证评测必需文件 ==="

          # 检查 kernel-rv（RISC-V 内核）
          if [ ! -f kernel-rv ]; then
            echo "❌ 错误：kernel-rv 文件不存在"
            exit 1
          fi
          echo "✓ kernel-rv 存在 ($(wc -c < kernel-rv) 字节)"

          # 检查 kernel-la（LoongArch64 内核）
          if [ ! -f kernel-la ]; then
            echo "❌ 错误：kernel-la 文件不存在"
            exit 1
          fi
          echo "✓ kernel-la 存在 ($(wc -c < kernel-la) 字节)"

          # 检查文件格式（应该是 ELF）
          file kernel-rv | grep -q ELF || echo "⚠️  警告：kernel-rv 不是 ELF 格式"
          file kernel-la | grep -q ELF || echo "⚠️  警告：kernel-la 不是 ELF 格式"

      - name: 检查可选文件
        run: |
          echo "=== 检查可选辅助文件 ==="

          if [ -f disk.img ]; then
            echo "✓ disk.img 存在 ($(wc -c < disk.img) 字节)"
          else
            echo "ℹ️  disk.img 不存在（可选文件）"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: oscomp-kernels
          path: |
            kernel-rv
            kernel-la
            disk.img
          retention-days: 7

  # 干净克隆测试：模拟真实评测场景
  fresh-clone-test:
    name: 干净克隆环境测试
    runs-on: ubuntu-latest
    container:
      image: docker.cnb.cool/starry-os/arceos-build:latest
      options: --user root

    steps:
      - name: 模拟评测系统克隆项目
        run: |
          echo "=== 模拟评测系统克隆项目 ==="
          cd /tmp
          rm -rf starryos-test
          git clone --depth=1 ${{ github.repositoryUrl }} starryos-test
          cd starryos-test

      - name: 清理隐藏目录
        run: |
          cd /tmp/starryos-test
          echo "=== 清理隐藏目录 ==="
          find . -name ".*" -type d -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null || true
          find . -name ".*" -type f -not -path "./.git/*" -delete 2>/dev/null || true

      - name: 执行 make all
        run: |
          cd /tmp/starryos-test
          echo "=== 在干净环境中执行 make all ==="
          make all

      - name: 验证构建结果
        run: |
          cd /tmp/starryos-test
          echo "=== 验证构建结果 ==="

          if [ ! -f kernel-rv ]; then
            echo "❌ 干净克隆环境：kernel-rv 构建失败"
            exit 1
          fi

          if [ ! -f kernel-la ]; then
            echo "❌ 干净克隆环境：kernel-la 构建失败"
            exit 1
          fi

          echo "✓ 干净克隆环境构建成功"
          echo "  kernel-rv: $(wc -c < kernel-rv) 字节"
          echo "  kernel-la: $(wc -c < kernel-la) 字节"
